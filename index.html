<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Breese St.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <span class="header-title">Breese St.</span>
    <span class="header-sub">Brunswick</span>
    <span id="clock" class="header-clock"></span>
  </header>

  <main class="dashboard">
<section class="card card-weather" id="weather-card">
      <div class="card-label">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        Weather
      </div>
      <div id="weather-content" class="loading">Loading…</div>
    </section>

    <section class="card card-places" id="places-card">
      <div class="places-card-header">
        <div class="card-label">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Open Now
        </div>
        <div class="places-filters">
          <div class="filter-search-wrap">
            <svg class="filter-search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="places-search" placeholder="name or type…" autocomplete="off" spellcheck="false" />
            <button id="places-search-clear" class="search-clear hidden" aria-label="Clear">✕</button>
          </div>
          <div class="filter-slider-wrap">
            <span class="slider-label">Within <strong id="dist-label">1 km</strong></span>
            <input type="range" id="places-dist-slider" min="100" max="1000" step="50" value="1000" />
          </div>
        </div>
      </div>
      <div id="keyword-chips"></div>
      <div id="places-content" class="loading">Loading…</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
